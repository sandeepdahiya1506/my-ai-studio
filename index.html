<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 Private AI Studio Mirror</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #1f2937; margin-bottom: 5px; }
        input[type="text"] { width: 80%; max-width: 600px; padding: 12px; border: 2px solid #d1d5db; border-radius: 8px; font-size: 16px; margin: 15px 0; }
        button { background: #2563eb; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        iframe { width: 100%; height: 850px; border: none; border-radius: 8px; margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 Secure AI Creative Studio Launcher</h1>
        <p>Enter your daily active runtime proxy address link to mount your cloud canvas interface.</p>
        <input type="text" id="urlInput" placeholder="Paste your active https://gradio.live link here...">
        <br>
        <button onclick="mountStudio()">🚀 Connect Engine</button>
        <iframe id="studioFrame"></iframe>
    </div>

    <script>
        function mountStudio() {
            const targetUrl = document.getElementById('urlInput').value.strip();
            if (!targetUrl) { alert('⚠️ Please paste your running Gradio live tunnel link!'); return; }
            const frame = document.getElementById('studioFrame');
            frame.src = targetUrl;
            frame.style.display = 'block';
        }
    </script>
</body>
</html>
